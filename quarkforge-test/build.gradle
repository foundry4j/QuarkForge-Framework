dependencies {
    api 'io.quarkus:quarkus-security'
    api 'org.eclipse.microprofile.jwt:microprofile-jwt-auth-api'
    api 'io.quarkus:quarkus-junit-mockito'
    api 'org.junit.jupiter:junit-jupiter-api'
    api 'io.quarkus:quarkus-arc'
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'jakarta.transaction:jakarta.transaction-api'
    testImplementation 'io.quarkus:quarkus-hibernate-orm'
    testImplementation 'io.quarkus:quarkus-jdbc-h2'
}
