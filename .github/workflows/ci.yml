name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    # Job-level env so the step-level "if" guard can see SONAR_TOKEN.
    # On fork pull requests the secret resolves to an empty string.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required for SonarCloud new-code analysis.
          fetch-depth: 0

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - name: Restore Gradle caches
        # 不要用 setup-java 的 cache: gradle —— 它的 key 包含所有构建脚本的哈希，
        # 改一行 build.gradle 整个依赖缓存就失效，CI 每次都要重新下载几百 MB。
        # 这里用 restore-keys 兜底：命中任意历史缓存即可复用依赖、wrapper 和 build cache。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build, test and analyze
        # 合并成一次 Gradle 调用：24 个子项目的配置阶段不便宜，跑两遍等于白付一次。
        # jacocoRootReport 把各模块的 exec 合并成 SonarCloud 需要的单个 XML；
        # fork pull request 拿不到 SONAR_TOKEN，此时跳过扫描。
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew --console=plain build jacocoRootReport sonar
          else
            ./gradlew --console=plain build jacocoRootReport
          fi

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/'
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn
