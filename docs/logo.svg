<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="qf-title qf-desc">
    <title id="qf-title">QuarkForge</title>
    <desc id="qf-desc">A Q monogram forged from steel plates, its tail a molten spark</desc>
    <defs>
        <linearGradient id="qf-badge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1C2942"/>
            <stop offset="1" stop-color="#0A0F1A"/>
        </linearGradient>
        <linearGradient id="qf-ring" x1="0.05" y1="0" x2="0.95" y2="1">
            <stop offset="0" stop-color="#A8E1FF"/>
            <stop offset="0.45" stop-color="#4C9FF3"/>
            <stop offset="1" stop-color="#2759BC"/>
        </linearGradient>
        <linearGradient id="qf-spark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFE9A6"/>
            <stop offset="0.4" stop-color="#FFB01F"/>
            <stop offset="1" stop-color="#F4511E"/>
        </linearGradient>
    </defs>
    <rect width="160" height="160" rx="36" fill="url(#qf-badge)"/>
    <rect x="0.9" y="0.9" width="158.2" height="158.2" rx="35.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <g transform="translate(-6 -6)">
        <circle cx="80" cy="80" r="36" fill="none" stroke="url(#qf-ring)" stroke-width="15"/>
        <g stroke="#070D18" stroke-opacity="0.75" stroke-width="2.4">
            <path d="M59.85 100.15 L49.24 110.76"/>
            <path d="M49.24 49.24 L59.85 59.85"/>
            <path d="M110.76 49.24 L100.15 59.85"/>
        </g>
        <path d="M104.75 94.14 A28.5 28.5 0 0 1 94.14 104.75 L119.95 130.56 L130.56 119.95 Z" fill="url(#qf-spark)"/>
    </g>
</svg>
