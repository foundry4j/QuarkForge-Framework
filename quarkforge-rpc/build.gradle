// quarkforge-rpc —— gRPC
// 需要 protobuf 编译 src/main/proto/*.proto 生成 Java stub
//
// Quarkus 插件（根脚本统一应用）会注入 native-test、quarkus-generated-sources 等源集，
// 这些源集名带连字符，而对应配置是驼峰命名（nativeTestCompileOnly）。protobuf 插件按
// <sourceSetName>CompileOnly 查找配置会抛 ConfigurationNotFound，这里补齐缺失的空配置。
sourceSets.findAll { it.name.contains('-') }.each { ss ->
    ['Implementation', 'CompileOnly', 'RuntimeOnly', 'AnnotationProcessor'].each { suffix ->
        def cfgName = "${ss.name}${suffix}"
        if (configurations.findByName(cfgName) == null) {
            configurations.create(cfgName)
        }
    }
}
apply plugin: 'com.google.protobuf'

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.65.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// protobuf 插件会自动把 build/generated/source/proto/main/{java,grpc} 加入 main 源集，
// 这里不再重复声明，否则 sourcesJar 会因重复条目失败。

dependencies {
    api project(':quarkforge-core')
    api 'io.quarkus:quarkus-arc'
    api 'io.quarkus:quarkus-grpc'
    // protoc-gen-grpc-java 生成的代码用了 javax.annotation.Generated
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
