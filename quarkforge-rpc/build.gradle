// quarkforge-rpc —— gRPC
// src/main/proto 由 quarkus-grpc 扩展在 quarkusGenerateCode 阶段编译（输出到
// build/classes/java/quarkus-generated-sources/grpc），不要再叠加 protobuf Gradle 插件，
// 否则两个插件会把同一批类生成两遍，编译期报 duplicate class。

dependencies {
    api project(':quarkforge-core')
    api 'io.quarkus:quarkus-arc'
    api 'io.quarkus:quarkus-grpc'
    // protoc 生成的代码用了 javax.annotation.Generated
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
