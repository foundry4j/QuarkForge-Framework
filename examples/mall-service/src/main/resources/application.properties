quarkus.application.name=quarkforge-sample-mall-service
quarkus.http.port=8080

# ---------- \u6570\u636E\u6E90\uFF1A\u793A\u4F8B\u4F7F\u7528\u5185\u5B58 H2\uFF0C\u751F\u4EA7\u66FF\u6362\u4E3A MySQL/PostgreSQL ----------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:qf_mall;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---------- JWT\uFF1A\u793A\u4F8B\u4F7F\u7528\u4ED3\u5E93\u5185\u7684\u6F14\u793A\u5BC6\u94A5\uFF0C\u751F\u4EA7\u8BF7\u66FF\u6362\u4E3A\u81EA\u6709\u5BC6\u94A5\u5E76\u901A\u8FC7\u6302\u8F7D\u6CE8\u5165 ----------
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=quarkforge
quarkforge.jwt.issuer=quarkforge
quarkforge.jwt.ttl-minutes=120

# ---------- \u6846\u67B6 ----------
quarkforge.data.worker-id=1
quarkforge.web.response.auto-wrap=true
quarkforge.web.access-log.enabled=true
quarkforge.audit.enabled=true
quarkforge.audit.operation-log.enabled=true
quarkforge.cache.local.default-ttl=PT5M

# ---------- OpenAPI ----------
quarkus.smallrye-openapi.info-title=QuarkForge Sample Mall Service
quarkus.smallrye-openapi.info-version=1.0.0
