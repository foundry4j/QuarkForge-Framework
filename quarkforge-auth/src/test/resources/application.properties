quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:qf_auth_test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

quarkforge.audit.enabled=false
quarkforge.auth.password.algorithm=bcrypt

# JWT 签发密钥：SmallRye 要求 PEM 或 JWK 格式，这里用 HS256 的 oct JWK
smallrye.jwt.sign.key={"kty":"oct","k":"cXVhcmtmb3JnZS10ZXN0LXNpZ25pbmcta2V5LTMyYnl0ZXMh","alg":"HS256"}
mp.jwt.verify.issuer=quarkforge
